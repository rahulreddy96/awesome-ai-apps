services:
  app:
    build:
      context: ..
      dockerfile: cloud_deploy/Dockerfile
    ports:
      - "${APP_PORT:-8501}:8501"
    environment:
      - NEBIUS_API_KEY=${NEBIUS_API_KEY}
      - CLOUD_TIER=${CLOUD_TIER:-minimal}
      - PROJECT=${PROJECT:-starter_ai_agents/agno_starter}
    env_file:
      - .env
    command: ["python", "-m", "cloud_deploy.run", "${PROJECT:-starter_ai_agents/agno_starter}"]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
